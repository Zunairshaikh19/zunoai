project_id = "ylenfbneddyuzrkckaul"

# Every function verifies the caller's *Firebase* ID token itself (see
# authenticate() in _shared/lib.ts). Supabase's own gateway-level JWT check must
# be disabled, otherwise it rejects the Firebase token before our code runs.
[functions.generate-image]
verify_jwt = false

[functions.confirm-purchase]
verify_jwt = false

[functions.economy]
verify_jwt = false

[functions.upload-image]
verify_jwt = false

[functions.mirror-image]
verify_jwt = false

[functions.split-prompts]
verify_jwt = false

# Called by Google's AdMob servers (signature-verified inside the function).
[functions.admob-ssv]
verify_jwt = false
